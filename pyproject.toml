[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-policy-workspace"
version = "0.0.0"
description = "Vendored diffusion_policy training workspace (train.py / eval.py + the diffusion_policy package)"
requires-python = ">=3.9"

[tool.setuptools]
py-modules = [
  "eval",
  "train",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["diffusion_policy*"]
namespaces = true
