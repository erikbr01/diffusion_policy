# lift_mh image training from the canonical robo_dataset VideoStore.
#
# Differences vs configs/image/lift_mh/diffusion_policy_cnn:
#   - dataset: RoboStoreImageDataset over data/.../image.video (H.264 store
#     written by `python -m policy_doctor.scripts.convert_dataset
#     convert=robomimic/lift_mh_image`); the original image.hdf5 stays as
#     task.dataset.dataset_path purely for split-mask metadata.
#   - delta actions (image.hdf5 is the delta-action robomimic export):
#     action dim 7, abs_action false everywhere.
#   - random crop runs as a GPU batch transform (robo_dataset tier 3,
#     per-timestep) instead of inside the obs encoder:
#     training.gpu_random_crop=true + policy.external_crop_shape=[76,76],
#     policy.crop_shape=null. The policy center-crops full-size obs at
#     validation/inference.
#
# Integration test: scripts/experiments/integration/run_lift_mh_image_robostore_integration.sh

_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace

shape_meta: &shape_meta
  action:
    shape: [7]
  obs:
    agentview_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
    robot0_eef_quat:
      shape: [4]
    robot0_gripper_qpos:
      shape: [2]

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score
dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  shuffle: true
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
exp_name: default
horizon: 16
keypoint_visible_rate: 1.0
logging:
  group: null
  id: null
  mode: online
  name: train_diffusion_unet_hybrid_lift_mh_robostore
  project: diffusion_policy_debug
  resume: true
  tags:
  - train_diffusion_unet_hybrid
  - lift_image_robostore
  - default
multi_run:
  run_dir: data/outputs/lift_mh_robostore/train_diffusion_unet_hybrid
  wandb_name_base: lift_mh_robostore_cnn
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: train_diffusion_unet_hybrid
obs_as_global_cond: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
past_action_visible: false
policy:
  _target_: diffusion_policy.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy
  cond_predict_scale: true
  # random crop moved to the GPU transform tier (training.gpu_random_crop)
  crop_shape: null
  external_crop_shape: [76, 76]
  eval_fixed_crop: false
  diffusion_step_embed_dim: 32
  down_dims:
  - 32
  - 64
  - 128
  horizon: 16
  kernel_size: 5
  n_action_steps: 8
  n_groups: 8
  n_obs_steps: 2
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  num_inference_steps: 100
  obs_as_global_cond: true
  obs_encoder_group_norm: true
  shape_meta: *shape_meta
task:
  abs_action: false
  dataset:
    _target_: diffusion_policy.dataset.robo_store_dataset.RoboStoreImageDataset
    store_path: data/robomimic/datasets/lift/mh/image.video
    dataset_path: data/robomimic/datasets/lift/mh/image.hdf5
    abs_action: false
    horizon: 16
    n_obs_steps: 2
    pad_after: 7
    pad_before: 1
    seed: 42
    shape_meta: *shape_meta
    val_ratio: 0.02
  dataset_path: data/robomimic/datasets/lift/mh/image.hdf5
  dataset_type: mh
  env_runner:
    _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
    abs_action: false
    crf: 22
    dataset_path: data/robomimic/datasets/lift/mh/image.hdf5
    fps: 10
    max_steps: 500
    n_action_steps: 8
    n_envs: null
    n_obs_steps: 2
    n_test: 30
    n_test_vis: 0
    n_train: 3
    n_train_vis: 0
    past_action: false
    render_obs_key: agentview_image
    shape_meta: *shape_meta
    test_start_seed: 100000
    tqdm_interval_sec: 1.0
    train_start_idx: 0
  name: lift_image_robostore
  shape_meta: *shape_meta
  task_name: lift
task_name: lift_image_robostore
training:
  checkpoint_every: 10
  debug: false
  device: cuda:0
  gpu_random_crop: true
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 30
  resume: true
  rollout_every: 10
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1
val_dataloader:
  batch_size: 64
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: false
